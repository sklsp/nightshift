[build-system]
requires = ["setuptools>=77"]  # 77+ reads license = "MIT" (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.16.1"
description = "Run a local LLM coding agent unattended: one spec file per item, a test gate that fits a 30-second command limit, and a supervisor."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "setuptools"]

[project.scripts]
nightshift = "nightshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightshift = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
mypy_path = "src"
strict = true
